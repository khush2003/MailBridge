name: MailBridge Windows
on:
  push:
    branches: [mailbridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: x86-windows
      VCPKG_DEFAULT_HOST_TRIPLET: x86-windows
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/mailsync/vcpkg-overlay-ports
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: microsoft/setup-msbuild@v2
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
          runVcpkgInstall: false
          doNotCache: true
      - name: Enable native dependency integration
        run: vcpkg integrate install
      - uses: actions/cache/restore@v4
        with:
          path: mailsync/vcpkg_installed
          key: mailbridge-native-x86-${{ hashFiles('mailsync/vcpkg.json', 'mailsync/vcpkg-configuration.json', 'mailsync/vcpkg-overlay-ports/**') }}
      - name: Identify native source
        id: engine-source
        shell: pwsh
        run: '"commit=$(git -C mailsync rev-parse HEAD)" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: mailsync/Windows/Release
          key: mailbridge-engine-win2022-${{ steps.engine-source.outputs.commit }}-v1
      - name: Build modified native engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: mailsync/Windows
        run: msbuild mailsync.sln /m /p:Configuration=Release /p:Platform=Win32 /p:VcpkgEnableManifest=true
      - uses: actions/cache/save@v4
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: mailsync/Windows/Release
          key: mailbridge-engine-win2022-${{ steps.engine-source.outputs.commit }}-v1
      - name: Stage engine and authentication dependencies
        shell: pwsh
        run: |
          Copy-Item mailsync/Windows/Release/mailsync.exe app/mailsync.exe
          Copy-Item mailsync/Windows/Release/*.dll app/ -Force
          $plugins = Get-ChildItem mailsync/vcpkg_installed -Recurse -Filter 'sasl*.dll' | Where-Object { $_.FullName -notmatch '\\debug\\' }
          if (!$plugins) { throw 'SMTP authentication plugins are missing' }
          $plugins | Copy-Item -Destination app/ -Force
          if (Test-Path app/zlib1.dll) { Copy-Item app/zlib1.dll app/zlib.dll -Force }
          foreach ($name in @('msvcr100.dll','msvcr120.dll','msvcp100.dll','msvcp120.dll','msvcp140.dll','vcruntime140.dll')) {
            $source = "C:\Windows\SysWOW64\$name"
            if (Test-Path $source) { Copy-Item $source app/ -Force }
          }
      - uses: actions/cache/save@v4
        with:
          path: mailsync/vcpkg_installed
          key: mailbridge-native-x86-${{ hashFiles('mailsync/vcpkg.json', 'mailsync/vcpkg-configuration.json', 'mailsync/vcpkg-overlay-ports/**') }}
      - name: Verify native retention on Windows
        shell: pwsh
        run: |
          python -m pip install -r mailsync/test/requirements.txt
          $env:MAILSYNC_BIN = (Resolve-Path app/mailsync.exe).Path
          New-Item -ItemType Directory -Force mailbridge-artifacts | Out-Null
          python -m pytest mailsync/test/test_mailbridge.py --servers fake -n 0 -q --basetemp=mailbridge-artifacts/native
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify Outlook export MIME serialization
        run: powershell.exe -NoProfile -File test/mailbridge/outlook-export.ps1
      - name: Install desktop dependencies
        run: npm ci
      - name: Verify sync and type checking
        run: |
          node --test test/mailbridge/*.test.cjs
          npm run typecheck
      - name: Build standalone desktop client
        run: npm run build -- --skip-installers
      - name: Verify packaged desktop
        run: node test/mailbridge/windows-smoke.cjs
      - name: Verify retained-mail workspace and optional Drive settings
        run: node test/mailbridge/windows-workspace.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: MailBridge-workspace-screenshots-${{ github.sha }}
          path: mailbridge-artifacts/windows-*.png
          if-no-files-found: error
      - name: Sign application when a certificate is configured
        if: vars.MAILBRIDGE_SIGNED_BUILDS == 'true'
        env:
          MAILBRIDGE_PFX_BASE64: ${{ secrets.MAILBRIDGE_PFX_BASE64 }}
          MAILBRIDGE_PFX_PASSWORD: ${{ secrets.MAILBRIDGE_PFX_PASSWORD }}
        run: pwsh app/build/mailbridge/sign.ps1 -Directory app/dist/MailBridge-win32-x64
      - name: Create Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler '/DBuildDirectory=..\..\dist\MailBridge-win32-x64' app/build/mailbridge/installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign installer when a certificate is configured
        if: vars.MAILBRIDGE_SIGNED_BUILDS == 'true'
        env:
          MAILBRIDGE_PFX_BASE64: ${{ secrets.MAILBRIDGE_PFX_BASE64 }}
          MAILBRIDGE_PFX_PASSWORD: ${{ secrets.MAILBRIDGE_PFX_PASSWORD }}
        run: pwsh app/build/mailbridge/sign.ps1 -Directory app/dist/mailbridge-installer
      - uses: actions/upload-artifact@v4
        with:
          name: MailBridge-review-installer-${{ github.sha }}
          path: app/dist/mailbridge-installer/*.exe
          if-no-files-found: error
      - name: Verify installer and uninstaller
        shell: pwsh
        run: |
          $installer = (Get-ChildItem app/dist/mailbridge-installer/*.exe | Select-Object -First 1).FullName
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/MailBridge'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $env:MAILBRIDGE_DESKTOP_BINARY = Join-Path $installed 'MailBridge.exe'
          if (!(Test-Path $env:MAILBRIDGE_DESKTOP_BINARY)) { throw 'Installed executable is missing' }
          foreach ($attempt in 1..5) {
            Write-Host "Installed fresh-profile launch $attempt of 5"
            node test/mailbridge/windows-smoke.cjs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $process = Start-Process -FilePath (Join-Path $installed 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0 -or (Test-Path $env:MAILBRIDGE_DESKTOP_BINARY)) { throw 'Uninstall did not remove the executable' }
          if (Get-ItemProperty -Path 'HKCU:\Software\RegisteredApplications' -Name MailBridge -ErrorAction SilentlyContinue) { throw 'Uninstall left the registered application entry' }
          Remove-Item Env:MAILBRIDGE_DESKTOP_BINARY
      - name: Export build information
        shell: pwsh
        run: |
          @{'commit' = '${{ github.sha }}'; 'engine' = (git -C mailsync rev-parse HEAD); 'signed' = ((Get-AuthenticodeSignature (Get-ChildItem app/dist/mailbridge-installer/*.exe | Select-Object -First 1).FullName).Status -eq 'Valid'); 'target' = 'Windows 10/11 x64'} | ConvertTo-Json | Out-File app/dist/mailbridge-installer/build-info.json
          Get-FileHash app/dist/mailbridge-installer/*.exe -Algorithm SHA256 | Format-List | Out-File app/dist/mailbridge-installer/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MailBridge-Windows-${{ github.sha }}
          path: app/dist/mailbridge-installer/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: MailBridge-failure-logs
          path: |
            mailsync/test/runs/
            mailbridge-artifacts/native/
            app/dist/mailbridge-smoke.log
          if-no-files-found: ignore
